steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_BASE=${_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_DOCS_BASE=${_DOCS_URL}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/zb-id-api-docs:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/zb-id-api-docs:latest'
      - '.'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/zb-id-api-docs:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/zb-id-api-docs:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'zb-id-api-docs'
      - '--image'
      - 'gcr.io/$PROJECT_ID/zb-id-api-docs:$COMMIT_SHA'
      - '--region'
      - 'europe-north1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'ZBID_STAGING_BASE=https://id-staging.zb.co.zw,NEXT_PUBLIC_TRYIT_ENABLED=true'
      - '--memory'
      - '512Mi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--port'
      - '3000'

images:
  - 'gcr.io/$PROJECT_ID/zb-id-api-docs:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/zb-id-api-docs:latest'

substitutions:
  _API_URL: ''
  _DOCS_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
